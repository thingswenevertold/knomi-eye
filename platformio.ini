[platformio]
; Fusionne les reglages qui contiennent des secrets et ne doivent
; donc pas etre versionnes.
extra_configs = platformio_local.ini

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Volontairement pas de upload_port / monitor_port ici : PlatformIO detecte
; le port tout seul, et ce numero change d'une machine a l'autre (COM3 sur un
; poste, COM4 sur un autre). Un numero fige en dur casse le flash partout
; ailleurs, en silence.
;
; Pour verifier quel port porte la carte avant de flasher :
;     py -3.12 tools/find_port.py
;
; Et pour savoir si elle execute vraiment le firmware plutot que de dormir en
; ROM download mode (voir PANDA_KNOMI_FINDINGS.md section 2) :
;     py -3.12 tools/find_port.py --check
;
; Si plusieurs adaptateurs serie sont branches en meme temps, epingle le bon
; port dans platformio_local.ini (ignore par git), jamais ici.

; KNOMI V1 = ESP32-WROVER-E, 16MB flash, 8MB PSRAM
board_build.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
board_upload.flash_size = 16MB

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    ; NimBLE plutot que Bluedroid : ~250 Ko de flash et ~20 Ko de RAM contre
    ; ~600 et ~50, ce qui compte avec WiFi + serveur web deja en place.
    h2zero/NimBLE-Arduino@^1.4.2
    esphome/AsyncTCP-esphome
    esphome/ESPAsyncWebServer-esphome

; Once the board has connected to WiFi at least once via serial flash,
; use this env to push firmware over the air instead of BOOT-button dancing.
; Set OTA_HOSTNAME in include/secrets.h, e.g. "knomi-eye.local" as upload_port,
; or replace with the device's IP if mDNS doesn't resolve on your network.
[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = knomi-eye.local
; upload_flags porte le mot de passe OTA : il vit dans
; platformio_local.ini, ignore par git. Voir le .example a cote.