[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600
upload_port = COM4
monitor_port = COM4

; KNOMI V1 = ESP32-WROVER-E, 16MB flash, 8MB PSRAM
board_build.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
board_upload.flash_size = 16MB

; FIRMWARE_VERSION is overridden by CI (see .github/workflows/build-firmware.yml)
; via the PLATFORMIO_BUILD_FLAGS env var, set to the short git commit hash.
; Local builds fall back to "dev" so the auto-updater always offers an update.
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DFIRMWARE_VERSION=\"dev\"

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    esphome/AsyncTCP-esphome
    esphome/ESPAsyncWebServer-esphome
    tzapu/WiFiManager@^2.0.17

; Once the board has connected to WiFi at least once via serial flash,
; use this env to push firmware over the air instead of BOOT-button dancing.
; Set OTA_HOSTNAME in include/secrets.h, e.g. "knomi-eye.local" as upload_port,
; or replace with the device's IP if mDNS doesn't resolve on your network.
[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = knomi-eye.local
upload_flags =
    --auth=choose-a-dev-only-password ; must match OTA_PASSWORD in include/secrets.h
