[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600
upload_port = COM4
monitor_port = COM4

build_flags =
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    miguelbalboa/MFRC522@^1.4.11
